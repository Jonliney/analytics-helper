name: Publish analytics package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-analytics-package-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          version: 12.3.4
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@^11.15.0

      - run: pnpm install --frozen-lockfile

      - name: Check release tag and publishing configuration
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const p = require('./package.json'); if (!p.name.startsWith('@') || p.name.startsWith('@company/')) throw new Error('Replace the placeholder package name with the real company npm scope.'); if (!p.repository?.url) throw new Error('Set package.json repository.url before publishing with npm trusted publishing.'); if ('v' + p.version !== process.env.RELEASE_TAG) throw new Error('Release tag must match package.json version.');"

      - name: Validate, build, and test
        run: pnpm run ci

      - name: Compile generated Java contract
        run: >-
          javac --release 17 -d "$RUNNER_TEMP/java-classes"
          generated/java/com/company/analytics/AnalyticsEvents.java

      - name: Publish private npm package
        run: npm publish --access restricted --tag latest

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create cross-language release archive
        env:
          VERSION: ${{ github.ref_name }}
        run: >-
          tar -czf "analytics-contracts-${VERSION#v}.tar.gz"
          event-definition.schema.json generated/analytics-catalog.json generated/java

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "GitHub release ${VERSION} already exists."
            exit 0
          fi
          gh release create "$VERSION" \
            "analytics-contracts-${VERSION#v}.tar.gz" \
            --generate-notes --title "$VERSION"
