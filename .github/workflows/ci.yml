name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          version: 12.3.4
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - name: Ensure generated artifacts are committed
        run: git diff --exit-code -- src/generated generated dist
      - name: Report analytics contract compatibility
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: >-
          node --import tsx check-analytics-compatibility.ts
          --base-ref "$BASE_REF" --format markdown >> "$GITHUB_STEP_SUMMARY"
      - run: >-
          javac --release 17 -d "$RUNNER_TEMP/java-classes"
          generated/java/com/company/analytics/AnalyticsEvents.java
